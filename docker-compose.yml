version: '3.1'

services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://leadgenerator-a9fi.onrender.com/
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - NODE_ENV=production
    volumes:
      - ~/.n8n:/home/node/.n8n
    env_file:
      - render.env